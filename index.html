<meta name="theme-color" content="#ecede9">
<title>Iconec · Plan selection</title>
<style>
/* Layout: a light review table. A thin white bar on top, a quiet canvas
   underneath where the live phone screens lead; one green accent for focus. */
:root {
  --ground: #ecede9;
  --paper: #ffffff;
  --ink: #121612;
  --ink-2: #565d54;
  --ink-3: #9aa097;
  --line: #dfe1dc;
  --hover: #f3f4f1;
  --accent: #284423;
  --accent-deep: #102c0b;
  --accent-tint: #e7ede4;
  --shadow: 0 1px 2px rgba(18, 22, 18, 0.06), 0 18px 40px -18px rgba(16, 44, 11, 0.22);

  --font: "Overused Grotesk", "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-xs: 12px;
  --t-sm: 13px;
  --t-md: 14px;
  --t-lg: 15px;
  --t-xl: 22px;

  --veil: rgba(229, 231, 226, 0.66);
  --veil-solid: rgba(229, 231, 226, 0.94);
  --lift: 0 1px 2px rgba(18, 22, 18, 0.07), 0 8px 20px -10px rgba(18, 22, 18, 0.22);

  /* Motion: state changes and moves are user-initiated, so both finish under 300ms. */
  --dur-state: 160ms;
  --dur-move: 280ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
  color-scheme: light;
}

@font-face { font-family: "Overused Grotesk"; src: url("OverusedGrotesk-Roman.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Overused Grotesk"; src: url("OverusedGrotesk-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Overused Grotesk"; src: url("OverusedGrotesk-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: swap; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--t-md);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
::selection { background: var(--accent-tint); color: var(--accent-deep); }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

.app { position: relative; height: 100%; }

/* Pressed state shared by every control: a small, quick give. */
.press { transition: background-color var(--dur-state) ease, transform var(--dur-state) var(--ease-out); }
.press:active { transform: scale(0.96); }

/* ---------- Top bar: three quiet islands floating over the canvas ---------- */
.topbar {
  position: absolute; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.island {
  box-sizing: border-box; height: 40px; display: flex; align-items: center;
  background: var(--paper); border-radius: 12px;
  box-shadow: var(--lift);
}
.title-island { padding: 0 16px; min-width: 0; }
.title { margin: 0; font-size: var(--t-md); font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tools { display: flex; gap: 8px; flex: none; }

.icon-btn {
  width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink);
  cursor: pointer;
}
.icon-btn:hover { background: var(--hover); }

.zoom { padding: 2px; gap: 0; }
.zoom button {
  height: 36px; min-width: 36px; padding: 0 6px;
  display: grid; place-items: center;
  border: 0; background: transparent; border-radius: 10px; cursor: pointer;
  font-size: var(--t-sm); font-variant-numeric: tabular-nums; color: var(--ink);
}
.zoom button:hover { background: var(--hover); }
#zoomLevel { min-width: 52px; color: var(--ink-2); }

.figma-link { gap: 8px; padding: 0 14px 0 12px; text-decoration: none; font-size: var(--t-sm); font-weight: 500; white-space: nowrap; }
.figma-link:hover { background: var(--hover); }

/* ---------- Canvas ---------- */
.viewport {
  position: absolute; inset: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.viewport.is-panning, .viewport.is-panning .frame-hit { cursor: grabbing; }
.viewport:focus { outline: none; }
.world {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  --z: 1;
  --title-size: max(40px, calc(14px / var(--z)));
  --title-gap: max(64px, calc(40px / var(--z)));
}
/* Zoomed far out there is no room for frame names: drop them and tuck titles closer. */
.world.is-far { --title-size: calc(13px / var(--z)); --title-gap: calc(10px / var(--z)); }
.world.is-far .frame-label, .world.is-tiny .row-title { display: none; }

.row-title {
  position: absolute;
  top: calc(var(--row-y) - var(--title-gap));
  margin: 0;
  transform: translateY(-100%);
  font-size: var(--title-size);
  line-height: 1.15;
  font-weight: 500;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: var(--ink);
  pointer-events: none;
}
.row-title span { color: var(--ink-2); font-weight: 400; }

.frame { position: absolute; width: 402px; height: 874px; }
.frame .scr {
  box-shadow: var(--shadow);
  outline: calc(2px / var(--z)) solid transparent;
  outline-offset: calc(6px / var(--z));
  transition: outline-color var(--dur-state) ease;
}
.frame-hit {
  position: absolute; inset: 0;
  padding: 0; border: 0; border-radius: 44px; background: transparent;
  cursor: pointer;
}
.frame-hit:focus-visible { outline: none; }
.frame:hover .scr { outline-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.frame:has(.frame-hit:focus-visible) .scr, .frame.is-active .scr { outline-color: var(--accent); }
.frame-label {
  position: absolute; left: 0; bottom: 100%;
  display: flex; gap: 6px; align-items: baseline;
  max-width: calc(402px * var(--z));
  padding-bottom: 8px;
  transform: scale(calc(1 / var(--z)));
  transform-origin: 0 100%;
  font-size: var(--t-xs);
  line-height: 16px;
  white-space: nowrap;
  pointer-events: none;
}
.frame-label b { font-weight: 500; flex: none; }
.frame-label span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.hint {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 8px 12px;
  border-radius: 999px;
  background: var(--paper);
  box-shadow: var(--lift);
  color: var(--ink-2);
  font-size: var(--t-xs);
  pointer-events: none;
  transition: opacity 200ms var(--ease-in), transform 200ms var(--ease-in);
}
.hint.is-gone { opacity: 0; transform: translateY(6px); }

/* ---------- Focus view ---------- */
.focus {
  position: fixed; inset: 0; z-index: 20;
  display: grid; grid-template-columns: minmax(0, 1fr) 340px;
  /* The canvas stays visible behind the screen, softened and dimmed so the phone is the focal point. */
  background: var(--veil);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
  backdrop-filter: blur(20px) saturate(1.15);
  animation: focus-in 240ms var(--ease-out);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .focus { background: var(--veil-solid); }
}
@keyframes focus-in { from { opacity: 0; } }
.focus.is-closing { animation: focus-out 160ms var(--ease-in) forwards; }
@keyframes focus-out { to { opacity: 0; } }
.stage {
  position: relative; margin: 0; min-width: 0; min-height: 0;
  display: grid; place-items: center;
  overflow: hidden;
}
.shot { position: relative; animation: shot-in 240ms var(--ease-out); }
@keyframes shot-in { from { transform: scale(0.97); } }
.shot > .scr { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: var(--shadow); }

/* Message A / B switch: drawn to UISegmentedControl's light-mode metrics
   (32pt tall, 2pt inset, grey fill track, white thumb that slides on a spring). */
.seg {
  position: relative; display: inline-grid; grid-template-columns: 1fr 1fr;
  align-self: flex-start; min-width: 232px;
  height: 32px; padding: 2px; border-radius: 9px;
  background: rgba(118, 118, 128, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.seg-thumb {
  position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px);
  border-radius: 7px; background: #ffffff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
  transition: transform var(--spring-dur, var(--dur-move)) var(--spring, var(--ease-out)), scale 200ms var(--ease-out);
}
.seg[data-m="b"] .seg-thumb { transform: translateX(100%); }
.seg.is-pressing .seg-thumb { scale: 0.95; }
.seg button {
  position: relative; z-index: 1;
  padding: 0 16px;
  border: 0; background: transparent; border-radius: 7px; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 400; letter-spacing: -0.08px; color: #000000; white-space: nowrap;
  transition: opacity 150ms ease;
  -webkit-tap-highlight-color: transparent;
}
.seg button[aria-checked="true"] { font-weight: 600; }
.seg button:not([aria-checked="true"]):active { opacity: 0.55; }

.info {
  display: flex; flex-direction: column; gap: 24px;
  min-height: 0; overflow-y: auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--paper);
  border-left: 1px solid var(--line);
}
.info-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.counter { color: var(--ink-2); font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
.info-head { display: flex; flex-direction: column; gap: 8px; }
.info-head h2 { margin: 0; font-size: var(--t-xl); line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; text-wrap: balance; }
.info-try { margin: 0; color: var(--ink-2); font-size: var(--t-sm); }
.actions { display: flex; flex-direction: column; gap: 8px; }
.action {
  height: 44px; padding: 0 14px;
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
  font-size: var(--t-md); text-decoration: none; text-align: left; cursor: pointer;
}
.action:hover { background: var(--hover); }
.action svg { flex: none; color: var(--ink-2); }
.pager { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pager .action { justify-content: center; }

/* ---------- Phone screens (ported from the Design canvas prototype) ---------- */
.scr {
  --kb-h: 281px;
  position: relative; width: 402px; height: 874px;
  overflow: hidden; display: flex; flex-direction: column;
  border-radius: 44px;
  background: #ffffff; color: #0a0a0a;
  font-family: var(--font); font-size: 16px; font-weight: 400; line-height: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
.scr *, .scr *::before, .scr *::after { box-sizing: border-box; }
.scr :where(p, h1, ul) { margin: 0; }
.scr :where(button) { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.scr :where(a) { color: #0a0a0a; text-decoration: underline; text-underline-offset: 2px; }
.scr :where(a:hover) { color: #284423; }
.scr button:focus-visible, .scr a:focus-visible { outline: 2px solid #284423; outline-offset: 2px; }
.scr ::selection { background: #dfe8dc; }

.sb { position: relative; height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding-top: 2px; color: #000; }
.sb-time { width: 154px; text-align: center; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.02em; }
.sb-island { position: absolute; left: 139px; top: 14px; width: 124px; height: 36px; border-radius: 18px; background: #000; }
.sb-icons { width: 154px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.home-ind { position: absolute; z-index: 5; left: 129px; bottom: 8px; width: 144px; height: 5px; border-radius: 100px; background: #000; pointer-events: none; }

.nav { height: 44px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px; }
.nav-back { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 22px; padding: 0; cursor: pointer; }
.scr-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 8px 20px 34px; }

.photos { position: relative; flex-shrink: 0; }
.ic-photo {
  position: absolute; display: block; object-fit: cover; border-radius: 16px; background: #2a2b2d;
  transition: left var(--dur-move) var(--ease-out), top var(--dur-move) var(--ease-out), width var(--dur-move) var(--ease-out), height var(--dur-move) var(--ease-out), opacity 200ms ease-out;
  -webkit-user-drag: none;
}
.piece { margin-top: 16px; display: flex; flex-direction: column; gap: 4px; }
.piece h1 { font-size: 18px; line-height: 24px; font-weight: 500; letter-spacing: -0.01em; color: #0a0a0a; }
.piece h1 span { font-weight: 400; color: #5c5c5c; }
.retail { font-size: 14px; line-height: 22px; color: #5c5c5c; }
.retail-val { position: relative; display: inline-block; font-size: 16px; font-weight: 600; color: #102c0b; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.ic-glint {
  position: absolute; top: -2px; bottom: -2px; left: -4px; right: -4px; pointer-events: none;
  background: linear-gradient(105deg, rgba(255,255,255,0) 32%, rgba(255,255,255,.88) 50%, rgba(255,255,255,0) 68%);
  background-size: 260% 100%; background-repeat: no-repeat; background-position: 160% 0;
  animation: ic-glint 3.4s cubic-bezier(.45,0,.2,1) 1s infinite;
}
@keyframes ic-glint { 0% { background-position: 160% 0; } 42%, 100% { background-position: -60% 0; } }

.perks { margin-top: 20px; padding: 0; list-style: none; display: grid; grid-template-columns: auto auto; justify-content: space-between; column-gap: 12px; row-gap: 10px; color: #284423; font-size: 14px; line-height: 20px; }
.perks li { display: flex; align-items: center; gap: 7px; }
.perks svg { flex-shrink: 0; }

.claim { margin-top: 24px; font-size: 20px; line-height: 26px; font-weight: 500; letter-spacing: -0.015em; }
.claim.is-in { animation: claim-in 200ms var(--ease-out); }
@keyframes claim-in { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } }

/* iOS-style rolling numerals: each changed character gets its own slot. */
.roll { display: inline-block; white-space: pre; font-variant-numeric: tabular-nums; }
.rd { display: inline-block; }
.rs { position: relative; }
.rd-old { position: absolute; left: 0; top: 0; }
.claim-a { color: #284423; font-weight: 600; }
.claim-b { display: inline-block; min-width: 2.1em; color: #5e8557; font-weight: 600; font-variant-numeric: tabular-nums; }

.tiles { margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile {
  height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 0 6px; background: #ffffff; border: 1px solid rgba(94,133,87,0.4); border-radius: 14px; cursor: pointer;
  transition: border-color var(--dur-state) ease-out, transform var(--dur-state) var(--ease-out);
}
.tile:active { transform: scale(0.97); }
.tile[aria-checked="true"] { border: 1.5px solid #5e8557; }
.tile-price { font-size: 16px; line-height: 22px; font-weight: 600; color: #5e8557; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile-price small { font-size: 14px; font-weight: 400; }
.tile-label { font-size: 14px; line-height: 20px; color: #5c5c5c; }

.nav-back { transition: transform var(--dur-state) var(--ease-out); }
.nav-back:active { transform: scale(0.96); }

/* Promo code row: opens the sheet; once a code is applied it names the code and offers to remove it. */
.promo { margin-top: 16px; width: 100%; height: 50px; flex-shrink: 0; display: flex; align-items: center; border-radius: 16px; background: #f5f5f5; transition: transform var(--dur-state) var(--ease-out); }
.promo:has(.promo-open:active) { transform: scale(0.98); }
.promo-open { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 0; border-radius: 16px; background: transparent; text-align: left; cursor: pointer; }
.promo-tag { flex: none; color: #0a0a0a; }
.promo-label { flex: 1; min-width: 0; font-size: 16px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.promo-label small { margin-left: 8px; font-size: 14px; font-weight: 400; color: #284423; }
.promo-add { font-size: 16px; line-height: 22px; color: #5c5c5c; }
.promo-clear { width: 44px; height: 44px; margin-right: 3px; flex: none; display: none; place-items: center; border: 0; border-radius: 22px; background: transparent; cursor: pointer; transition: transform var(--dur-state) var(--ease-out); }
.promo-clear:active { transform: scale(0.94); }
.promo.is-applied .promo-tag { color: #5e8557; }
.promo.is-applied .promo-label { font-weight: 500; }
.promo.is-applied .promo-add, .promo.is-applied .promo-chev { display: none; }
.promo.is-applied .promo-open { padding-right: 4px; }
.promo.is-applied .promo-clear { display: grid; }
.due-was { margin-right: 6px; font-size: 14px; font-weight: 400; color: #8a8a8a; text-decoration: line-through; animation: claim-in 200ms var(--ease-out); }
.grow { flex: 1 1 auto; min-height: 16px; }
.due-row { display: flex; justify-content: space-between; font-size: 16px; line-height: 22px; font-weight: 500; }
.due-row span:last-child, .num { font-variant-numeric: tabular-nums; }
.sub { font-size: 14px; line-height: 20px; color: #5c5c5c; }
.terms { margin-top: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.box-wrap { position: relative; width: 24px; height: 24px; flex-shrink: 0; display: block; }
.box-input { position: absolute; inset: 0; width: 24px; height: 24px; margin: 0; opacity: 0; cursor: pointer; }
.box { width: 24px; height: 24px; border-radius: 6px; border: 1.75px solid rgba(0,0,0,0.28); background: #ffffff; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: background-color var(--dur-state) ease, border-color var(--dur-state) ease, transform var(--dur-state) var(--ease-out); }
.box svg { opacity: 0; transform: scale(0.6); transition: opacity var(--dur-state) ease, transform var(--dur-state) var(--ease-out); }
.box-input:active + .box { transform: scale(0.96); }
/* Checked colour: brand/Iconec Green – Lighter, from the Figma Checkbox component. */
.box-input:checked + .box { border-color: #5e8557; background: #5e8557; }
.box-input:checked + .box svg { opacity: 1; transform: none; }
.box-input:focus-visible + .box { outline: 2px solid #284423; outline-offset: 2px; }
.terms-text { font-size: 14px; line-height: 20px; color: #5c5c5c; }
.cta { width: 100%; height: 56px; flex-shrink: 0; border: 0; border-radius: 999px; background: #102c0b; color: #ffffff; font-size: 16px; line-height: 22px; font-weight: 500; cursor: pointer; transition: transform var(--dur-state) var(--ease-out); }
.cta:active { transform: scale(0.98); }
.fine { text-align: center; font-size: 12px; line-height: 16px; color: #5c5c5c; }
.pinbar { margin: 0 -20px; padding: 14px 20px 0; border-top: 1px solid rgba(0,0,0,0.08); display: flex; align-items: center; gap: 12px; }
.pinbar-total { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pinbar-total p:first-child { font-size: 16px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pinbar-total p:first-child span { font-size: 14px; font-weight: 400; }
.pinbar .cta { width: 132px; height: 52px; }


/* ---------- Calm A: two steps, one decision per screen ----------
   Neutral ink does the work; the only colour is the percentage and the button.
   No shimmer, no green tiles; the photos still follow the plan. */
.calm-stack { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.calm-pane {
  position: absolute; inset: 0; display: flex; flex-direction: column; background: #ffffff;
  transition: transform var(--dur-move) var(--ease-out), opacity var(--dur-move) var(--ease-out);
}
.calm-pane.is-next { transform: translateX(100%); }
.scr[data-step="2"] .calm-pane.is-first { transform: translateX(-28%); opacity: 0.4; }

    $("counter").textContent = `${focusIdx + 1} of ${screens.length}`;
    $("frameLink").hidden = !s.node;
    if (s.node) $("frameLink").href = FIGMA + s.node;
    try { history.replaceState(null, "", "#" + s.id); } catch {}
    shot.style.animation = "none"; void shot.offsetWidth; shot.style.animation = "";
  }
  function setMessage(m) {
    if (!fState || !liveScr?.setMessage) return;
    liveScr.setMessage(m);
  }

  function openFocus(id) {
    clearTimeout(closeTimer);
    focus.classList.remove("is-closing");
    if (focus.hidden) lastFocused = document.activeElement;
    focus.hidden = false;
    showScreen(screens.findIndex((s) => s.id === id));
    setActive(id);
    $("closeFocus").focus();
  }
  function closeFocus(toCanvas = false) {
    if (focus.hidden || focus.classList.contains("is-closing")) return;
    const id = screens[focusIdx]?.id;
    const finish = () => {
      focus.classList.remove("is-closing");
      focus.hidden = true;
      liveScr?.destroy(); liveScr?.remove(); liveScr = null;
    };
    if (reduceMotion) finish();
    else { focus.classList.add("is-closing"); closeTimer = setTimeout(finish, 160); }
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    if (toCanvas && id) { zoomToScreen(id); frameEls[id].querySelector(".frame-hit").focus({ preventScroll: true }); }
    else if (lastFocused && document.contains(lastFocused)) lastFocused.focus({ preventScroll: true });
  }

  $("closeFocus").addEventListener("click", () => closeFocus());
  $("showOnCanvas").addEventListener("click", () => closeFocus(true));
  $("resetBtn").addEventListener("click", mountScreen);
  $("prevBtn").addEventListener("click", () => showScreen(focusIdx - 1));
  $("nextBtn").addEventListener("click", () => showScreen(focusIdx + 1));
  // Segmented control behaves like iOS: tap a segment, or press the thumb (it shrinks) and slide it across.
  document.documentElement.style.setProperty("--spring", PhoneScreens.spring.easing);
  document.documentElement.style.setProperty("--spring-dur", PhoneScreens.spring.dur + "ms");
  let segDrag = null;
  seg.addEventListener("pointerdown", (e) => {
    const b = e.target.closest("button");
    if (!b || !fState) return;
    segDrag = { id: e.pointerId, onThumb: b.dataset.m === fState.message };
    if (segDrag.onThumb) seg.classList.add("is-pressing");
  });
  window.addEventListener("pointermove", (e) => {
    if (!segDrag?.onThumb || e.pointerId !== segDrag.id) return;
    const r = seg.getBoundingClientRect();
    const m = e.clientX - r.left < r.width / 2 ? "a" : "b";
    if (m !== fState.message) setMessage(m);
  });
  const segEnd = () => { seg.classList.remove("is-pressing"); segDrag = null; };
  window.addEventListener("pointerup", segEnd);
  window.addEventListener("pointercancel", segEnd);
  seg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setMessage(b.dataset.m); });
  new ResizeObserver(fitShot).observe(stage);

  // Swipe between screens on touch, from the space around the phone.
  let swipe = null;
  stage.addEventListener("pointerdown", (e) => { swipe = e.target.closest(".scr") ? null : { x: e.clientX, y: e.clientY }; });
  stage.addEventListener("pointerup", (e) => {
    if (!swipe) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) showScreen(focusIdx + (dx < 0 ? 1 : -1));
  });

  /* ---------- Keyboard ---------- */
  document.addEventListener("keydown", (e) => {
    const inField = e.target.closest?.("input, textarea, [contenteditable]");
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!focus.hidden) {
      if (e.key === "Escape") { e.preventDefault(); if (!liveScr?.dismissSheet?.() && !liveScr?.goBack?.()) closeFocus(); }
      else if (inField) return;
      else if (e.key === "ArrowRight") { e.preventDefault(); showScreen(focusIdx + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); showScreen(focusIdx - 1); }
      else if ((e.key === "a" || e.key === "A" || e.key === "b" || e.key === "B") && !e.repeat) setMessage(e.key.toLowerCase());
      else if (e.key === "Tab") {
        const els = [...focus.querySelectorAll("button, a[href], input")].filter((el) => el.offsetParent !== null && el.tabIndex >= 0 && !el.closest("[inert]") && !el.closest("[hidden]"));
        const first = els[0], last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (inField) return;
    if (e.code === "Digit1" && e.shiftKey) { e.preventDefault(); fitAll(); setActive(null); }
    else if (e.code === "Digit0" && e.shiftKey) { e.preventDefault(); const { w, h } = vpSize(); const wx = (w / 2 - cam.x) / cam.z, wy = (h / 2 - cam.y) / cam.z; moveTo({ z: 1, x: w / 2 - wx, y: h / 2 - wy }); }
    else if (e.key === "+" || e.key === "=") { e.preventDefault(); stepZoom(1); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); stepZoom(-1); }
    else if (e.key.startsWith("Arrow")) {
      e.preventDefault();
      const d = e.shiftKey ? 240 : 80;
      cam.x += e.key === "ArrowLeft" ? d : e.key === "ArrowRight" ? -d : 0;
      cam.y += e.key === "ArrowUp" ? d : e.key === "ArrowDown" ? -d : 0;
      render();
    }
    else return;
    interacted();
  });

  /* ---------- Start ---------- */
  let lastSize = vpSize();
  new ResizeObserver(() => {
    const s = vpSize();
    if (!touched) fitAll(false);
    else { cam.x += (s.w - lastSize.w) / 2; cam.y += (s.h - lastSize.h) / 2; render(); }
    lastSize = s;
  }).observe(viewport);

  fitAll(false);
  const openFromHash = () => {
    const id = location.hash.slice(1);
    if (!byId[id]) return;
    if (focus.hidden) openFocus(id);
    else if (screens[focusIdx].id !== id) showScreen(screens.findIndex((s) => s.id === id));
  };
  window.addEventListener("hashchange", openFromHash);
  openFromHash();
})();
</script>

</body>
</html>
